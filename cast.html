<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Cast — Marcelo Schmidt</title>
<meta name="description" content="Redirects to the current live cast-relay receiver session.">
<style>
  body{margin:0;background:#0c0c0c;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{max-width:520px;text-align:center}
  h1{font-size:1.4rem;font-weight:600;margin-bottom:1rem;color:#4ecdc4}
  p{color:#a0a0a0;line-height:1.6;margin-bottom:1rem;font-size:.95rem}
  code{background:#161616;padding:2px 8px;border-radius:6px;color:#f0c040;font-family:'JetBrains Mono',monospace;font-size:.9rem}
  a{color:#4ecdc4}
  .spinner{width:32px;height:32px;border:3px solid #222;border-top-color:#4ecdc4;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 1.5rem}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fallback{margin-top:2rem;padding-top:1.5rem;border-top:1px solid #222;font-size:.85rem;color:#666}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h1>Connecting to live cast…</h1>
  <p id="status">Looking up current session…</p>
  <div class="fallback">
    <p>If nothing happens, no cast session is currently active. Ask Natasha to mint a new one.</p>
    <p><a href="projects.html#cast">← Back to projects</a></p>
  </div>
</div>
<script>
(async () => {
  const status = document.getElementById('status');
  try {
    const r = await fetch('data/cast-current.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('no config');
    const j = await r.json();
    if (!j.url) throw new Error('no url');
    status.innerHTML = 'Redirecting to <code>' + (j.code || j.url) + '</code>…';
    setTimeout(() => { window.location.replace(j.url); }, 400);
  } catch (e) {
    status.textContent = 'No active cast session found.';
  }
})();
</script>
</body>
</html>
